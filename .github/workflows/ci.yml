name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validators:
    name: Host Automated Validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (Active LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run Converter and Command Parity Validators
        run: |
          node tools/test_converter.js
          node tools/validate_command_parity.js

  build-firmware:
    name: Build Firmware Binary & Validate OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/requirements.txt

      - name: Set up Node.js (Active LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Build Firmware Binary via PlatformIO
        run: |
          pio run -e esp32-c6-devkitc-1

      - name: Package Zigbee OTA Image (.ota)
        run: |
          mkdir -p dist
          python tools/build_ota_image.py \
            --input .pio/build/esp32-c6-devkitc-1/firmware.bin \
            --output dist/1000-0906-010400aa-LogitechZ906.ota

      - name: Generate Zigbee2MQTT index.json & SHA-512
        run: |
          OTA_FILENAME="1000-0906-010400aa-LogitechZ906.ota"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v1.4.0/${OTA_FILENAME}"
          node tools/generate_ota_index.js dist/${OTA_FILENAME} "${RELEASE_URL}" dist/index.json

      - name: Validate Generated OTA Container & Index
        run: |
          node tools/validate_ota_image.js dist/1000-0906-010400aa-LogitechZ906.ota dist/index.json
          node tools/test_ota_package.js

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
