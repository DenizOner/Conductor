name: Build & Release Zigbee OTA Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build Firmware & Package Zigbee OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/requirements.txt

      - name: Set up Node.js (Active LTS)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Run Host Automated Validators
        run: |
          node tools/test_converter.js
          node tools/validate_command_parity.js

      - name: Build Firmware Binary via PlatformIO
        run: |
          pio run -e esp32-c6-devkitc-1

      - name: Package Zigbee OTA Image (.ota)
        run: |
          mkdir -p dist
          python tools/build_ota_image.py \
            --input .pio/build/esp32-c6-devkitc-1/firmware.bin \
            --output dist/1000-0906-010400aa-LogitechZ906.ota

      - name: Generate Zigbee2MQTT index.json & SHA-512
        run: |
          OTA_FILENAME="1000-0906-010400aa-LogitechZ906.ota"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            # Manual workflow_dispatch on a branch (dry-run/validation):
            # Fall back to canonical target firmware version (v1.4.0) instead of producing malformed refs/heads/... URLs
            RELEASE_TAG="v1.4.0"
          fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${OTA_FILENAME}"
          node tools/generate_ota_index.js dist/${OTA_FILENAME} "${RELEASE_URL}" dist/index.json

      - name: Validate Generated OTA Container & Index
        run: |
          node tools/validate_ota_image.js dist/1000-0906-010400aa-LogitechZ906.ota dist/index.json
          node tools/test_ota_package.js

      - name: Prepare Release Artifacts Directory
        run: |
          mkdir -p dist/release
          cp .pio/build/esp32-c6-devkitc-1/firmware.bin dist/release/
          cp dist/1000-0906-010400aa-LogitechZ906.ota dist/release/
          cp dist/index.json dist/release/
          cp tools/conductor_converter.mjs dist/release/

      - name: Attest Build Provenance for Release Assets
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/release/firmware.bin
            dist/release/1000-0906-010400aa-LogitechZ906.ota
            dist/release/index.json
            dist/release/conductor_converter.mjs

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-assets
          path: dist/release/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-assets
          path: dist/release/

      - name: Create GitHub Release and Upload Verified Artifacts
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: "Release ${{ github.ref_name }} — Native Zigbee OTA Upgrade"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/release/firmware.bin
            dist/release/1000-0906-010400aa-LogitechZ906.ota
            dist/release/index.json
            dist/release/conductor_converter.mjs
