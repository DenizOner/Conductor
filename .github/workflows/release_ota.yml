name: Build & Release Zigbee OTA Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build Firmware & Package Zigbee OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Host Automated Validators
        run: |
          node tools/test_converter.js
          node tools/validate_command_parity.js

      - name: Build Firmware Binary via PlatformIO
        run: |
          pio run -e esp32-c6-devkitc-1

      - name: Package Zigbee OTA Image (.ota)
        run: |
          mkdir -p dist
          python tools/build_ota_image.py \
            --input .pio/build/esp32-c6-devkitc-1/firmware.bin \
            --output dist/1000-0906-010400aa-LogitechZ906.ota

      - name: Generate Zigbee2MQTT index.json & SHA-512
        run: |
          RELEASE_TAG=${GITHUB_REF#refs/tags/}
          [ "$RELEASE_TAG" = "refs/heads/main" ] && RELEASE_TAG="v1.4.0"
          OTA_FILENAME="1000-0906-010400aa-LogitechZ906.ota"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${OTA_FILENAME}"
          node tools/generate_ota_index.js dist/${OTA_FILENAME} "${RELEASE_URL}" dist/index.json

      - name: Validate Generated OTA Container & Index
        run: |
          node tools/validate_ota_image.js dist/1000-0906-010400aa-LogitechZ906.ota dist/index.json
          node tools/test_ota_package.js

      - name: Prepare Release Artifacts Directory
        run: |
          mkdir -p release_assets
          cp .pio/build/esp32-c6-devkitc-1/firmware.bin release_assets/
          cp dist/1000-0906-010400aa-LogitechZ906.ota release_assets/
          cp dist/index.json release_assets/
          cp tools/conductor_converter.mjs release_assets/

      - name: Attest Build Provenance for Release Assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release_assets/firmware.bin
            release_assets/1000-0906-010400aa-LogitechZ906.ota
            release_assets/index.json
            release_assets/conductor_converter.mjs

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release_assets/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release_assets/

      - name: Create GitHub Release and Upload Verified Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }} — Native Zigbee OTA Upgrade"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/firmware.bin
            release_assets/1000-0906-010400aa-LogitechZ906.ota
            release_assets/index.json
            release_assets/conductor_converter.mjs
