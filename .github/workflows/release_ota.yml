name: Build & Release Zigbee OTA Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build Firmware & Package Zigbee OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/requirements.txt

      - name: Set up Node.js (Active LTS)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Run Host Automated Validators
        run: |
          node tools/test_converter.js
          node tools/validate_command_parity.js

      - name: Build Firmware Binary via PlatformIO
        run: |
          pio run -e esp32-c6-devkitc-1

      - name: Package Zigbee OTA Image (.ota)
        run: |
          mkdir -p dist
          python tools/build_ota_image.py \
            --input .pio/build/esp32-c6-devkitc-1/firmware.bin \
            --output dist/1000-0906-010400aa-LogitechZ906.ota

      - name: Generate Zigbee2MQTT index.json & SHA-512
        run: |
          OTA_FILENAME="1000-0906-010400aa-LogitechZ906.ota"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            # Manual workflow_dispatch on a branch (dry-run/validation):
            # Fall back to canonical target firmware version (v1.4.0) instead of producing malformed refs/heads/... URLs
            RELEASE_TAG="v1.4.0"
          fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${OTA_FILENAME}"
          node tools/generate_ota_index.js dist/${OTA_FILENAME} "${RELEASE_URL}" dist/index.json

      - name: Validate Generated OTA Container & Index
        run: |
          node tools/validate_ota_image.js dist/1000-0906-010400aa-LogitechZ906.ota dist/index.json
          node tools/test_ota_package.js

      - name: Prepare Release Artifacts Directory
        run: |
          mkdir -p dist/release
          cp .pio/build/esp32-c6-devkitc-1/firmware.bin dist/release/
          cp dist/1000-0906-010400aa-LogitechZ906.ota dist/release/
          cp dist/index.json dist/release/
          cp tools/conductor_converter.mjs dist/release/

      - name: Validate Four Local Release Assets Before Attestation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v1.4.0" # Branch-only workflow_dispatch never publishes.
          fi
          node tools/verify_release_assets.js dist/release "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Attest Build Provenance for Release Assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/firmware.bin
            dist/release/1000-0906-010400aa-LogitechZ906.ota
            dist/release/index.json
            dist/release/conductor_converter.mjs

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Check out verification scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js for read-only verification
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Download Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release/
          digest-mismatch: error

      - name: Verify Downloaded Assets and Build Attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify_release_assets.js dist/release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          node tools/release_publication_guard.js attest dist/release "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" release_ota.yml

      - name: Refuse To Overwrite an Existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)"
          status=$?
          set -e
          if [[ "$status" == "0" ]]; then
            echo "::error::Release already exists; refusing modification or publication"
            exit 1
          fi
          if [[ "$result" != *"(HTTP 404)"* ]]; then
            echo "::error::Cannot confirm release is absent; refusing publication"
            exit 1
          fi

      - name: Create DRAFT GitHub Release and Upload Verified Artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "Release ${{ github.ref_name }} — Native Zigbee OTA Upgrade"
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/firmware.bin
            dist/release/1000-0906-010400aa-LogitechZ906.ota
            dist/release/index.json
            dist/release/conductor_converter.mjs

      - name: Pin DRAFT Release ID, Tag Commit and Four Asset IDs/Digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/release_publication_guard.js prepare dist/release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/conductor-release-snapshot.json"

      - name: Recheck Pinned DRAFT and Publish Only by Exact Release ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/release_publication_guard.js publish dist/release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/conductor-release-snapshot.json"
