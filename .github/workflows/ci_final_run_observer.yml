# P20-S5a3 B1: observe only. No commit statuses or permission escalation.
name: CI Final-Run Observer (Read-Only)

on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  inspect:
    name: Observe CI Run (Read-Only; Not Required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js (Active LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Inspect authoritative CI without status publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/ci_final_run_observer.js
